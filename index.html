<div class="bar"><button class="bt gh" data-a="add" data-id="${id}">Add to bag</button><button class="bt" data-a="buy" data-id="${id}">Buy now</button></div>`);}

function coV(){show(`<h2>Checkout</h2><input id="nm" placeholder="Full name"><input id="ph" type="tel" placeholder="Phone number"><input id="ad" placeholder="Delivery address"><select id="ar"><option value="in">Inside the Valley (Kathmandu, Lalitpur, Bhaktapur)</option><option value="out">Outside the Valley</option></select><div id="pm"></div><div id="sm"></div><p class="er" id="er"></p><button class="bt" data-a="go">Continue</button>`);pmR()}
function pmR(){const a=$('#ar').value,s=sub(),f=FEE[a];$('#pm').innerHTML=(a=='in'?'<label><input type="radio" name="pay" value="cod" checked> Cash on delivery</label>':'<label><input type="radio" name="pay" value="adv" checked> Rs 500 advance by QR, the rest on delivery</label>')+'<label><input type="radio" name="pay" value="full"> Pay the full amount by QR</label>';
$('#sm').innerHTML=`<p class="l2"><span>Subtotal</span>${R(s)}</p><p class="l2"><span>Delivery</span>${R(f)}</p><p class="tot"><span>Total</span><b>${R(s+f)}</b></p>`}
function go(){const g=i=>$('#'+i).value.trim(),a=$('#ar').value,pay=document.querySelector('input[name=pay]:checked').value;
if(!g('nm')||g('ph').replace(/\D/g,'').length<7||!g('ad')){$('#er').textContent='Add your name, a phone number and your address to continue.';return}
const s=sub(),t=s+FEE[a],due=pay=='cod'?0:pay=='adv'?ADV:t;
ord={no:'BC-'+Date.now(),nm:g('nm'),ph:g('ph'),ad:g('ad'),a,pay,s,f:FEE[a],tot:t,due,it:items().map(i=>i.q+'× '+i.p[1]).join(', '),shot:0,shotData:'',paymentStatus:pay==='cod'?'COD — awaiting delivery':'Awaiting payment verification',created:new Date().toISOString(),products:items().map(i=>({name:i.p[1],qty:i.q,price:i.p[2]})),earned:0};due?payV():place()}
function payV(){show(`<h2>Pay ${R(ord.due)}</h2><p class="mut">Order ${ord.no}${ord.pay=='adv'?'. This is the advance, the rest is paid on delivery.':''}</p><img class="qr" src="${ST('qr',null)||QR0}" alt="Payment QR"><p class="mut">Scan with your mobile banking or wallet app and pay exactly ${R(ord.due)}.</p><button class="bt" data-a="paid">I’ve paid</button><div id="up" hidden><p>Upload a screenshot of your payment.</p><input type="file" accept="image/*" id="sf"><p class="mut">Maximum original file size: 20 MB. Images are compressed in this demo before saving.</p><img id="shotpreview" class="qr" hidden alt="Payment screenshot preview"><button class="bt" id="sb" disabled data-a="place">Submit order</button></div>`)}
async function place(){
  const submitButton=$('#sb'); if(submitButton){submitButton.disabled=true;submitButton.textContent='Submitting order…'}
  try {
    // Orders are sent to the server, which stores them and emails the store automatically.
    if(CFG.SCRIPT_URL)await fetch(CFG.SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...ord,key:CFG.KEY})});
    const result={notificationSent:!!CFG.SCRIPT_URL};
    const L=ST('orders',[]); if(!L.some(o=>o.no===ord.no)){L.push({...ord,serverSaved:true});SV('orders',L)}
    cart={};cnt();
    const paymentText=ord.pay==='cod'?'Pay on delivery.':ord.pay==='adv'?'QR advance screenshot submitted; remaining balance is due on delivery.':'QR payment screenshot submitted; payment is awaiting verification.';
    show(`<h2>Order received</h2><p>Thank you, ${esc(ord.nm)}. Your order number is <b>${esc(ord.no)}</b>. We’ll call you to confirm it before it ships.</p><p class="mut">${esc(ord.it)}<br>Total ${R(ord.tot)}. ${esc(paymentText)}</p><p class="mut">${result.notificationSent?'Your order details have been emailed to the store automatically. '+(ord.shotData?'Your payment screenshot was attached to the email and has been saved for the store.':'The store has been notified of your order.'):'Your order was saved, but the store email notification could not be confirmed. Please message the store on WhatsApp to ensure they see it.'}</p><a class="bt" target="_blank" rel="noopener" href="https://wa.me/${ST('wa',WA0)}?text=${encodeURIComponent('Hi, I placed order '+ord.no+' ('+R(ord.tot)+') on your website. Payment method: '+(ord.pay==='cod'?'Cash on delivery':ord.pay==='adv'?'QR advance + cash on delivery':'QR / wallet payment')+'.')}">Message us on WhatsApp</a><button class="bt gh" data-a="x">Keep shopping</button>`);
  } catch(err) {
    if(submitButton){submitButton.disabled=false;submitButton.textContent='Submit order'}
    alert(err.message+' Check your internet connection or contact the store on WhatsApp.');
  }
}
function admV(){const L=ST('orders',[]),now=new Date(),same=(o,days)=>{const d=new Date(o.created||0);return (now-d)>=0&&(now-d)<days*86400000},paid=L.filter(o=>o.paymentStatus==='paid'||(o.pay!=='cod'&&o.shotData)),sum=a=>a.reduce((n,o)=>n+(o.earned||((o.pay==='cod')?0:(o.paymentStatus==='paid'?o.due:0)),0),0),prodCounts={};L.forEach(o=>(o.products||[]).forEach(p=>prodCounts[p.name]=(prodCounts[p.name]||0)+p.qty));const top=Object.entries(prodCounts).sort((a,b)=>b[1]-a[1]).slice(0,5);
show(`<h2>Host dashboard</h2><p class="mut">Demo host PIN required. This PIN is only a front-end gate, not production-grade security.</p><div id="adminlock"><input id="adminpin" type="password" inputmode="numeric" placeholder="Host PIN"><button class="bt" data-a="unlock">Unlock dashboard</button></div><div id="adminbody" hidden>
<div class="st"><div><b>${L.length}</b>Total orders</div><div><b>${R(sum(L))}</b>Verified earnings</div><div><b>${paid.length}</b>Paid / screenshot orders</div></div>
<h3>Earnings</h3><div class="st"><div><b>${R(sum(L.filter(o=>same(o,1))))}</b>Today</div><div><b>${R(sum(L.filter(o=>same(o,7))))}</b>Last 7 days</div><div><b>${R(sum(L.filter(o=>same(o,30))))}</b>Last 30 days</div></div>
<h3>Top sellers</h3>${top.map(([n,q])=>`<p class="or"><b>${esc(n)}</b> · ${q} sold</p>`).join('')||'<p class="mut">No sales yet.</p>'}
<h3>Payment QR</h3><img class="qr" src="${ST('qr',null)||QR0}" alt="Payment QR"><p class="mut">This is the QR currently shown at checkout. Upload a merchant QR image to replace it.</p><input type="file" accept="image/*" id="qf"><button class="bt gh" data-a="rq">Restore provided QR</button>
<h3>WhatsApp number</h3><input id="wn" value="${ST('wa',WA0)}" placeholder="97798XXXXXXXX"><button class="bt gh" data-a="sw">Save number</button>
<h3>Orders and customer details</h3>${L.slice().reverse().map(o=>`<details class="or" open><summary><b>${esc(o.no)}</b> · ${R(o.tot)} · ${esc(o.nm)}</summary><p>Phone: ${esc(o.ph)}<br>Address: ${esc(o.ad)}<br>Items: ${esc(o.it)}<br>Payment method: ${o.pay==='cod'?'Cash on delivery':o.pay==='adv'?'QR advance + cash on delivery':'Full QR payment'}<br>Amount due by QR: ${R(o.due)}<br>Status: ${esc(o.paymentStatus|| (o.shotData?'Screenshot submitted — verify manually':o.pay==='cod'?'COD — not yet collected':'Awaiting payment verification'))}<br>Order date: ${esc(o.created||'Unknown')}</p>${o.shotData?`<a href="${o.shotData}" target="_blank">View payment screenshot</a>`:'<p class="mut">No payment screenshot saved.</p>'}<button class="bt gh" data-a="verify" data-id="${esc(o.no)}">Mark payment verified</button></details>`).join('')||'<p class="mut">No orders yet.</p>'}
<p class="mut">Demo data is stored in this browser only. Automatic email alerts, shared multi-device order storage and secure host-only access require a server/backend.</p><button class="bt gh" data-a="cl">Clear demo orders</button></div>`)}

const rs=(f,cb)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,600/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.9))};i.src=r.result};r.readAsDataURL(f)};
function compressShot(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,1400/im.width,1400/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72))};im.onerror=()=>alert('Could not read this image.');im.src=r.result};r.readAsDataURL(file)}
const A={x(){ov.className=''},shop(){$('#shop').scrollIntoView()},p(t){prod(t.dataset.p)},c(t){cat=t.dataset.c;home();if(t.dataset.go)$('#shop').scrollIntoView()},tab(t){prod(cur[0],+t.dataset.i)},
th(t){$('#mi').src=IMG[t.dataset.k];document.querySelectorAll('.th img').forEach(i=>i.classList.toggle('on',i==t));$('#mi').classList.remove('z')},
add(t){cart[t.dataset.id]=(cart[t.dataset.id]||0)+1;cnt();cartV()},buy(t){cart[t.dataset.id]=(cart[t.dataset.id]||0)+1;cnt();coV()},
m(t){if(--cart[t.dataset.id]<1)delete cart[t.dataset.id];cnt();cartV()},pl(t){cart[t.dataset.id]++;cnt();cartV()},cart:cartV,co(){coV()},go,paid(){$('#up').hidden=false},unlock(){if($('#adminpin').value!==(ST('hostpin','2468'))){alert('Incorrect host PIN. Demo default PIN is 2468; change it in the live backend before launch.');return}$('#adminlock').hidden=true;$('#adminbody').hidden=false},verify(t){const L=ST('orders',[]),o=L.find(x=>x.no===t.dataset.id);if(o){o.paymentStatus='Payment verified by host';o.earned=o.due;SV('orders',L);admV();$('#adminlock').hidden=true;$('#adminbody').hidden=false}},place,adm(){CFG.SHEET_URL?window.open(CFG.SHEET_URL,'_blank'):alert('Add your Google Sheet link to CFG.SHEET_URL in index.html.')},qrs(){admV()},
rq(){try{localStorage.removeItem('qr')}catch(e){}admV()},sw(){SV('wa',$('#wn').value.replace(/\D/g,''));admV()},cl(){SV('orders',[]);admV()},review(t){const text=$('#rvt').value.trim();if(!$('#rve').value.trim()||!$('#rvn').value.trim()||!text){alert('Please enter your email, name and review.');return}const all=ST('reviews',{});all[t.dataset.id]=all[t.dataset.id]||[];all[t.dataset.id].push({email:$('#rve').value.trim(),name:$('#rvn').value.trim(),rating:+$('#rvr').value,text,created:new Date().toISOString()});SV('reviews',all);prod(t.dataset.id,2)}};
document.addEventListener('click',e=>{if(e.target.id=='mi'){const m=e.target;m.style.transformOrigin=(e.offsetX/m.width*100)+'% '+(e.offsetY/m.height*100)+'%';m.classList.toggle('z');return}const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t)});

$('#q').onchange=e=>{const v=e.target.value;cat=v==='hoodies'?'Hoodies':v==='pants'?'Pants':v==='t-shirts'?'T-shirts':'All';home();document.querySelectorAll('nav .ch').forEach(b=>b.classList.toggle('on',b.dataset.c===cat))};
home();
